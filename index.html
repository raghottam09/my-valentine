<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Special ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #ff4d6d;
            --soft-rose: #ffccd5;
            --deep-rose: #c9184a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Floating Hearts Background */
        .heart-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(201, 24, 74, 0.15);
            z-index: 10;
            max-width: 450px;
            width: 90%;
            border: 2px solid white;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--deep-rose);
            font-size: 2.8rem;
            margin-bottom: 2rem;
            line-height: 1.2;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            height: 100px;
            position: relative;
        }

        button {
            padding: 18px 40px;
            font-size: 1.3rem;
            font-weight: 500;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background: var(--primary-red);
            color: white;
            z-index: 100;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background: var(--deep-rose);
        }

        #noBtn {
            background: #f8f9fa;
            color: #6c757d;
            position: absolute;
        }

        .success-content {
            display: none;
            animation: fadeIn 1s ease-in;
        }

        .meme-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .meme-gallery img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .crying-cat {
            position: absolute;
            width: 80px;
            border-radius: 50%;
            animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>
<body>

    <div class="heart-bg" id="heartBg"></div>

    <div id="proposalCard" class="container">
        <h1>Will you be my Valentine this year?</h1>
        <div class="btn-group" id="btnContainer">
            <button id="yesBtn" onclick="handleYes()">Yes!</button>
            <button id="noBtn" onmouseover="dodgeNo()" onclick="dodgeNo()">No</button>
        </div>
    </div>

    <div id="successContent" class="container success-content">
        <h1>I knew you'd say Yes! ❤️</h1>
        <p style="color: #666;">Can't wait to spend it with you.</p>
        <div class="meme-gallery">
            <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Y1djhhdXh0b25uYTRoamN6Z3B3ZHBzbmR5ZnRqaGJ0dnd4eXdyNiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L4lvBps67dY7S/giphy.gif" alt="Love">
            <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NidXFnbXF6bzV3Y29wbmVpbmx5bmY4bnVpY2FiaHpxeHh4eHh4eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26BRv0ThflsHCqfJA/giphy.gif" alt="Hearts">
        </div>
    </div>

    <script>
        // Floating hearts effect
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.style.position = 'absolute';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            heart.style.opacity = Math.random();
            heart.style.transition = 'transform 5s linear, opacity 5s';
            document.getElementById('heartBg').appendChild(heart);

            setTimeout(() => {
                heart.style.transform = 'translateY(-110vh)';
                heart.style.opacity = '0';
            }, 100);

            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 300);

        let yesScale = 1;
        
        function dodgeNo() {
            const noBtn = document.getElementById('noBtn');
            const container = document.getElementById('btnContainer');
            
            // Strategic movement within the container range
            const maxX = window.innerWidth - 150;
            const maxY = window.innerHeight - 150;
            
            noBtn.style.left = Math.random() * maxX + 'px';
            noBtn.style.top = Math.random() * maxY + 'px';

            // Make YES irresistible
            yesScale += 0.15;
            document.getElementById('yesBtn').style.transform = `scale(${yesScale})`;
            
            // Add a "Sad" visual cue
            const cry = document.createElement('img');
            cry.src = 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYzhiazV5bmx6bmx6bmx6bmx6bmx6bmx6bmx6bmx6bmx6bmx6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/OPU6wUKFt8I6BQeLSz/giphy.gif';
            cry.className = 'crying-cat';
            cry.style.left = Math.random() * 80 + 'vw';
            cry.style.top = Math.random() * 80 + 'vh';
            document.body.appendChild(cry);
            setTimeout(() => cry.remove(), 2000);
        }

        function handleYes() {
            // Email setup (Optional: integrate EmailJS here)
            document.getElementById('proposalCard').style.display = 'none';
            document.getElementById('successContent').style.display = 'block';
            
            // Final Celebration
            for(let i=0; i<50; i++) {
                setTimeout(createHeart, i * 100);
            }
        }
    </script>
</body>
</html>
