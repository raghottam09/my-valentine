<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #ff4d6d;
            --deep-rose: #c9184a;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(201, 24, 74, 0.15);
            z-index: 10;
            max-width: 400px;
            width: 85%;
            border: 2px solid white;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--deep-rose);
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }

        .btn-group {
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 20px; 
            margin-top: 30px; 
            min-height: 150px; /* Space for the button to jump */
            position: relative;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #yesBtn {
            background: var(--primary-red);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
            z-index: 2; /* Keeps Yes on top */
        }

        #noBtn {
            background: #ffffff;
            color: #999;
            border: 1px solid #ddd;
            position: relative; /* Starts visible next to Yes */
            z-index: 1;
        }

        .floating-emoji {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-110vh); opacity: 0; }
        }

        #successContent { display: none; }
    </style>
</head>
<body>

    <div id="proposalCard" class="container">
        <div style="font-size: 60px; margin-bottom: 10px;">💌</div>
        <h1>Will you be my Valentine?</h1>
        <div class="btn-group">
            <button id="yesBtn" onclick="handleYes()">Yes!</button>
            <button id="noBtn" onmouseover="dodgeNo()" onclick="dodgeNo()">No</button>
        </div>
    </div>

    <div id="successContent" class="container">
        <div style="font-size: 80px; margin-bottom: 10px;">💖</div>
        <h1>I love you!</h1>
        <p style="color: #666; font-size: 1.2rem;">Best decision ever! 🎉</p>
        <div style="font-size: 40px; margin-top: 20px;">👩‍❤️‍👨🌹✨</div>
    </div>

    <script>
        function spawnEmoji(emoji) {
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerHTML = emoji;
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = '100vh';
            el.style.fontSize = (Math.random() * 30 + 20) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        setInterval(() => spawnEmoji('❤️'), 600);

        let yesScale = 1;
        
        function dodgeNo() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            // On the first hover, switch to 'absolute' so it can fly anywhere
            noBtn.style.position = 'absolute';
            
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            yesScale += 0.25;
            yesBtn.style.transform = `scale(${yesScale})`;
            spawnEmoji('😢');
        }

        function handleYes() {
            document.getElementById('proposalCard').style.display = 'none';
            document.getElementById('successContent').style.display = 'block';
            for(let i=0; i<40; i++) {
                setTimeout(() => spawnEmoji('💖'), i * 80);
            }
        }
    </script>
</body>
</html>
