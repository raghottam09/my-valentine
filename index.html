<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #ff4d6d;
            --soft-rose: #ffccd5;
            --deep-rose: #c9184a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .heart-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(201, 24, 74, 0.1);
            z-index: 10;
            max-width: 400px;
            width: 85%;
            border: 2px solid white;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--deep-rose);
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            min-height: 120px;
            position: relative;
        }

        button {
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yesBtn {
            background: var(--primary-red);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        #noBtn {
            background: #ffffff;
            color: #888;
            position: absolute;
            border: 1px solid #eee;
        }

        .success-content {
            display: none;
            animation: popIn 0.6s ease-out forwards;
        }

        .image-box {
            width: 100%;
            height: 200px;
            background: #fff0f3;
            border-radius: 20px;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        .floating-emoji {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            font-size: 2rem;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="heart-bg" id="heartBg"></div>

    <div id="proposalCard" class="container">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="btn-group" id="btnContainer">
            <button id="yesBtn" onclick="handleYes()">Yes!</button>
            <button id="noBtn" onmouseover="dodgeNo()" onclick="dodgeNo()">No</button>
        </div>
    </div>

    <div id="successContent" class="container success-content">
        <h1>YAY! Best Day Ever! 🥰</h1>
        <p style="color: #d63384; font-weight: 500;">You just made my heart skip a beat!</p>
        <div class="image-box">
            <img src="https://i.imgur.com/vHdfyXn.gif" alt="Happy Dance">
        </div>
    </div>

    <script>
        // Floating hearts in background
        function createHeart(emoji = '❤️') {
            const heart = document.createElement('div');
            heart.className = 'floating-emoji';
            heart.innerHTML = emoji;
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        setInterval(() => createHeart('❤️'), 400);

        let yesScale = 1;
        
        function dodgeNo() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            // Move No Button
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 60);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            // Grow Yes Button
            yesScale += 0.2;
            yesBtn.style.transform = `scale(${yesScale})`;

            // Add crying emoji whenever she tries to click No
            createHeart('😢');
        }

        function handleYes() {
            document.getElementById('proposalCard').style.display = 'none';
            document.getElementById('successContent').style.display = 'block';
            
            // Celebration explosion
            for(let i=0; i<30; i++) {
                setTimeout(() => createHeart('💖'), i * 100);
            }
        }
    </script>
</body>
</html>
