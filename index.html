<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Valentine ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #ff4d6d;
            --soft-rose: #ffccd5;
            --deep-rose: #c9184a;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(201, 24, 74, 0.2);
            z-index: 10;
            max-width: 400px;
            width: 85%;
            border: 2px solid white;
            transition: all 0.5s ease;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--deep-rose);
            font-size: 2.8rem;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .btn-group {
            display: flex; justify-content: center; align-items: center;
            gap: 20px; margin-top: 30px; height: 120px; position: relative;
        }

        button {
            padding: 18px 45px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        #yesBtn {
            background: var(--primary-red);
            color: white;
            z-index: 100;
        }

        #noBtn {
            background: #ffffff;
            color: #999;
            position: absolute;
            border: 1px solid #eee;
        }

        .success-page { display: none; }

        .big-heart {
            font-size: 100px;
            animation: pulse 1.5s infinite;
            display: block;
            margin: 20px 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .floating-emoji {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="proposalCard" class="container">
        <span class="big-heart">💌</span>
        <h1>Will you be my Valentine?</h1>
        <div class="btn-group" id="btnContainer">
            <button id="yesBtn" onclick="handleYes()">Yes!</button>
            <button id="noBtn" onmouseover="dodgeNo()" onclick="dodgeNo()">No</button>
        </div>
    </div>

    <div id="successCard" class="container success-page">
        <span class="big-heart">💖</span>
        <h1>I love you!</h1>
        <p style="color: #666; font-size: 1.1rem;">You just made me the happiest person alive! 🎉</p>
        <div style="font-size: 50px; margin-top: 20px;">👩‍❤️‍👨✨</div>
    </div>

    <script>
        // Floating emoji generator
        function spawnEmoji(emoji) {
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerHTML = emoji;
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = '100vh';
            el.style.fontSize = (Math.random() * 30 + 20) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        // Background hearts
        setInterval(() => spawnEmoji('❤️'), 500);

        let yesScale = 1;
        
        function dodgeNo() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            // Move No Button anywhere on screen
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 100);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            // Make Yes Button grow
            yesScale += 0.2;
            yesBtn.style.transform = `scale(${yesScale})`;

            // Visual feedback
            spawnEmoji('😢');
        }

        function handleYes() {
            document.getElementById('proposalCard').style.display = 'none';
            document.getElementById('successCard').style.display = 'block';
            
            // Explosion of celebration
            for(let i=0; i<40; i++) {
                setTimeout(() => spawnEmoji('💖'), i * 100);
            }
        }
    </script>
</body>
</html>
